<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1rstSports | Siempre Pr1mero</title>
    
    <!-- Scripts Externos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;600;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'f1-bg': '#050505',
              'f1-card': '#0a0a0a',
              'f1-accent': '#ccff00',
              'f1-special': '#ffcc00',
              'f1-primary': '#2563eb',
              'f1-muted': '#a1a1aa'
            },
            fontFamily: {
              header: ['Chakra Petch', 'sans-serif'],
              body: ['Inter', 'sans-serif'],
              italic: ['Playfair Display', 'serif']
            }
          }
        }
      }
    </script>
    <style>
      @keyframes scroll-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-scroll {
        animation: scroll-left 50s linear infinite;
      }
      .animate-scroll:hover {
        animation-play-state: paused;
      }
      body {
        background-color: #050505;
        color: white;
        font-family: 'Inter', sans-serif;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // --- DATOS ---
      const LIVE_SCORES = [
        
        // Resultados de la Jornada 4 de la LIGA MX (30 y 31 de Enero de 2026)
        { liga: "LIGA MX", local: "Puebla", vis: "Toluca", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "31 ENE", hora: "02:00 CET" },
        { liga: "LIGA MX", local: "Pumas", vis: "Santos", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "31 ENE", hora: "04:00 CET" },
        { liga: "LIGA MX", local: "Juárez", vis: "Cruz Azul", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "31 ENE", hora: "04:06 CET" },
        { liga: "LIGA MX", local: "Atlas", vis: "Mazatlán", s1: "1", s2: "1", st: "FINAL", fecha: "31 ENE", hora: "17:00" }, // Resultado de referencia, verificar fecha y hora exactas
        { liga: "LIGA MX", local: "América", vis: "Necaxa", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "31 ENE", hora: "16:00" },
        { liga: "LIGA MX", local: "Atlético San Luis", vis: "Chivas", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "31 ENE", hora: "17:00" },
        { liga: "LIGA MX", local: "Monterrey", vis: "Xolos", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "31 ENE", hora: "19:00" },
        { liga: "LIGA MX", local: "León", vis: "Tigres", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "31 ENE", hora: "19:00" },

        // Partidos de la NFL y Super Bowl LX
        { liga: "NFL CONF", local: "Seahawks", vis: "Rams", s1: "20", s2: "17", st: "FINAL", fecha: "25 ENE", hora: "17:30" }, // Resultado de ejemplo, verificar resultado real
        { liga: "NFL CONF", local: "Broncos", vis: "Patriots", s1: "10", s2: "27", st: "FINAL", fecha: "25 ENE", hora: "14:00" }, // Resultado de ejemplo, verificar resultado real
        { liga: "SUPER BOWL LX", local: "Seahawks", vis: "Patriots", s1: "-", s2: "-", st: "PRÓXIMO", fecha: "08 FEB", hora: "17:30" },

        // Resultados de partidos amistosos de México
        { liga: "MÉXICO", local: "México", vis: "Panamá", s1: "2", s2: "0", st: "FINAL", fecha: "22 ENE", hora: "20:00" }, // Resultado de ejemplo, verificar resultado real
        { liga: "MÉXICO", local: "México", vis: "Bolivia", s1: "1", s2: "1", st: "FINAL", fecha: "25 ENE", hora: "19:30" } // Resultado de ejemplo, verificar resultado real
      ];


      const LATEST_NEWS = [
        { id: "1", tag: "TENIS", title: "El sufrimiento de apoyar siempre a ‘Sasha’", image: "zverev-1", link: "nota-zverev.html" },
        { id: "1", tag: "BÉISBOL", title: "Clásico Mundial 2026: Sedes, estrellas e historias", image: "wbc-1.jpg", link: "nota-wbc-2026.html" },
        { id: "2", tag: "MLB | SALÓN DE LA FAMA", title: "Carlos Beltrán y Andrew Jones: los nuevos huéspedes de Cooperstown", image: "national.jpg", description: "Hitos históricos: El boricua y el curazoleño alcanzan la inmortalidad.", link: "nota-cooperstown.html", specialColor: "#003278" },
        { id: "3", tag: "SELECCIÓN MEXICANA", title: "Invasión Rojiblanca: 8 jugadores de Chivas llamados al Tri", image: "chivas-2.jpg", link: "nota-chivas-seleccion.html", specialColor: "#d50a0a" },
        { id: "4", tag: "LA LIGA", title: "Florentino le hace las maletas a Xabi Alonso", image: "xabi-alonso.jpg", link: "nota-xabi-alonso.html" },
        { id: "5", tag: "BÉISBOL", title: "Kershaw pospone el retiro: Lanzará con EE. UU. en el Clásico Mundial", image: "kershaw-1.jpg", link: "nota-kershaw-wbc.html", specialColor: "#2563eb" },
        { id: "6", tag: "FÚTBOL INT.", title: "Senegal y Marruecos: La gran final de la Copa Africana", image: "afcon-hero.jpg", link: "nota-afcon-final.html" }
      ];

      const CAROUSEL_ITEMS = [
        { id: "hero-1", tag: "DAKAR", title: "Final memorable en Yanbu:", image: "luciano-benavides-win.png", link: "nota-dakar-2026" },
        { id: "hero-1", tag: "LIGA MX", title: "Chivas: Identidad clara y paso perfecto con Milito", image: "chivas-1.jpg", link: "nota-chivas-lider.html" },
        { id: "hero-2", tag: "NFL PLAYOFFS", title: "El Camino al Super Bowl: Seattle vs LA Rams", image: "Seattle vs. LA Rams.png", link: "analisis-equipos-playoffs-nfl.html" },
        { id: "hero-3", tag: "LA LIGA", title: "Barça se despega: Líder absoluto con 49 puntos", image: "barcelona.jpg", link: "nota-barca-lider.html" }
      ];

      const STANDINGS = [
        { name: "LIGA MX", icon: "fa-futbol", link: "futbol.html", rows: [{ name: "Chivas", val: "9" }, { name: "Toluca", val: "7" }, { name: "Monterrey", val: "6" }, { name: "Cruz Azul", val: "6" }, { name: "Atlas", val: "6" }] },
        { name: "LA LIGA", icon: "fa-flag", link: "futbol.html", rows: [{ name: "FC Barcelona", val: "49" }, { name: "Real Madrid", val: "48" }, { name: "Villarreal", val: "41" }, { name: "Atlético Madrid", val: "41" }, { name: "Espanyol", val: "34" }] },
        { name: "PREMIER", icon: "fa-crown", link: "futbol.html", rows: [{ name: "Arsenal FC", val: "50" }, { name: "Man City", val: "43" }, { name: "Aston Villa", val: "43" }, { name: "Liverpool FC", val: "36" }, { name: "Man United", val: "35" }] },
        { name: "NFL SEEDS", icon: "fa-football", link: "seccion-nfl.html", rows: [{ name: "Seahawks", val: "(1)" }, { name: "Broncos", val: "(1)" }, { name: "Patriots", val: "(2)" }, { name: "Rams", val: "(5)" }, { name: "Lions", val: "Finalista" }] }
      ];

      const CATEGORY_CARDS = [
        { name: "NFL", icon: "fa-football", link: "seccion-nfl.html" },
        { name: "Fútbol", icon: "fa-futbol", link: "futbol.html" },
        { name: "Béisbol", icon: "fa-baseball-bat-ball", link: "seccion-beisbol.html" },
        { name: "Tenis", icon: "fa-baseball", link: "australian-open-2026.html" },
        { name: "Crónicas", icon: "fa-book-open", link: "cronicas-del-balon.html", special: true },
        { name: "Motor", icon: "fa-flag-checkered", link: "seccion-motor.html" },
        { name: "Boxeo", icon: "fa-hand-fist", link: "boxeo.html" },
        { name: "Nosotros", icon: "fa-users", link: "quienes-somos.html" }
      ];

      // --- COMPONENTE PRINCIPAL ---
      const App = () => {
        const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
        const [activeSlide, setActiveSlide] = useState(0);

        useEffect(() => {
          const timer = setInterval(() => {
            setActiveSlide(prev => (prev + 1) % CAROUSEL_ITEMS.length);
          }, 5000);
          return () => clearInterval(timer);
        }, []);

        return (
          <div className="min-h-screen flex flex-col font-body bg-f1-bg text-white">
            {/* TOP BAR */}
            <div className="bg-black py-2 px-[5%] flex justify-between items-center text-[0.7rem] text-f1-muted border-b border-white/10">
              <div className="uppercase tracking-widest">CDMX | 21 ENE 2026</div>
              <div className="flex gap-4">
                <i className="fa-brands fa-facebook-f hover:text-f1-accent cursor-pointer"></i>
                <i className="fa-brands fa-x-twitter hover:text-f1-accent cursor-pointer"></i>
                <i className="fa-brands fa-instagram hover:text-f1-accent cursor-pointer"></i>
              </div>
            </div>

            {/* HEADER */}
            <header className="sticky top-0 z-[2000] bg-black/90 backdrop-blur-md border-b border-white/10 px-[5%] py-4 flex items-center justify-between">
              <a href="index.html" className="flex items-center gap-3 group">
                <img src="logof1.png" className="h-10 w-auto rounded" alt="Logo" />
                <span className="font-header font-bold italic text-2xl tracking-tighter uppercase">
                  F1RST<span className="text-f1-accent group-hover:text-white transition-colors">SPORTS</span>
                </span>
              </a>

              <nav className="hidden md:flex gap-6 items-center">
                {['Inicio', 'NFL', 'Motor', 'Crónicas', 'Liga MX', 'Beisbol', 'Boxeo'].map((item) => (
                  <a key={item} href={item === 'NFL' ? 'seccion-nfl.html' : item === 'Motor' ? 'seccion-motor.html' : item === 'Crónicas' ? 'cronicas-del-balon.html' : item === 'Liga MX' ? 'futbol.html' : '#'} className="font-header font-bold text-sm uppercase tracking-wider text-f1-muted hover:text-f1-accent transition-colors">
                    {item}
                  </a>
                ))}
              </nav>
              <a href="australian-open-2026.html" className="hidden lg:block bg-f1-primary px-6 py-2 rounded font-bold uppercase text-xs tracking-widest">Mundial '26</a>
            </header>

            {/* SCORE TICKER */}
            <div className="bg-[#080808] border-b border-white/10 flex h-[75px] overflow-hidden relative z-100">
              <div className="bg-f1-primary text-white font-header font-extrabold flex items-center px-6 text-[0.8rem] uppercase whitespace-nowrap z-20 shadow-[10px_0_20px_black]">Marcadores</div>
              <div className="flex animate-scroll whitespace-nowrap items-center">
                {[...LIVE_SCORES, ...LIVE_SCORES].map((game, i) => (
                  <div key={i} className="min-w-[240px] px-6 border-r border-white/10 py-2 flex flex-col justify-center">
                    <div className="flex justify-between text-[0.6rem] font-bold text-white/40 uppercase">
                      <span>{game.liga}</span>
                      <span>{game.fecha} | {game.hora}</span>
                    </div>
                    <div className="flex justify-between font-semibold text-[0.85rem] mt-1">
                      <div className="flex flex-col"><span>{game.local}</span><span>{game.vis}</span></div>
                      <div className="flex flex-col text-right font-header text-f1-accent"><span>-</span><span>-</span></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <main className="max-w-[1400px] mx-auto w-full px-5 py-10">
              {/* HERO */}
              <div className="relative w-full h-[60vh] min-h-[450px] overflow-hidden rounded-xl border-b-4 border-f1-accent bg-black">
                {CAROUSEL_ITEMS.map((slide, i) => (
                  <div key={slide.id} className={`absolute inset-0 transition-opacity duration-1000 flex flex-col justify-end p-10 md:p-16 ${i === activeSlide ? 'opacity-100 z-10' : 'opacity-0 z-0'}`}>
                    <img src={slide.image} className="absolute inset-0 w-full h-full object-cover brightness-50" alt={slide.title} />
                    <div className="relative z-10">
                      <span className="bg-f1-accent text-black font-header font-extrabold text-[0.75rem] px-3 py-1 rounded-sm uppercase mb-4 inline-block">{slide.tag}</span>
                      <h2 className="font-header text-4xl md:text-6xl font-black uppercase leading-none tracking-tighter max-w-4xl mb-6">{slide.title}</h2>
                      <a href={slide.link} className="inline-block border border-white px-8 py-3 font-bold text-sm tracking-widest uppercase hover:bg-white hover:text-black transition-all">Leer Nota</a>
                    </div>
                  </div>
                ))}
              </div>
                
  
              {/* ÚLTIMAS NOTICIAS */}
              <div className="mt-16 mb-8 flex items-center gap-4">
                <div className="w-1.5 h-10 bg-f1-accent"></div>
                <h2 className="font-header text-3xl font-bold uppercase tracking-tight">Últimas Noticias</h2>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                {LATEST_NEWS.map((item) => (
                  <article key={item.id} className="group bg-f1-card border border-white/10 rounded-xl overflow-hidden hover:border-f1-accent hover:-translate-y-2 transition-all flex flex-col">
                    <div className="h-[220px] overflow-hidden relative">
                      <img src={item.image} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt={item.title} />
                      {item.specialColor && <div className="absolute top-4 left-4 z-10"><span style={{ backgroundColor: item.specialColor }} className="text-white text-[0.6rem] font-header font-black px-2 py-1 rounded shadow-lg uppercase">{item.tag}</span></div>}
                    </div>
                    <div className="p-6 flex flex-col flex-grow">
                      {!item.specialColor && <span className="text-f1-accent text-[0.65rem] font-extrabold uppercase mb-2">{item.tag}</span>}
                      <h3 className="font-header text-xl font-bold leading-tight mb-4 group-hover:text-f1-accent transition-colors">{item.title}</h3>
                      <a href={item.link} className="mt-auto inline-block font-bold text-xs uppercase border-b-2 border-f1-accent pb-0.5 tracking-wider">Leer más &rarr;</a>
                    </div>
                  </article>
                ))}
              </div>

              {/* SECTION: CRONICAS BANNER */}
              <section className="my-20 bg-gradient-to-r from-black via-[#0a0a0a] to-black border border-white/10 rounded-2xl overflow-hidden flex flex-col md:flex-row items-stretch">
                <div className="flex-1 p-10 md:p-16 flex flex-col justify-center">
                  <span className="font-italic italic text-f1-special text-lg mb-2">Nueva Sección Editorial</span>
                  <h2 className="font-header text-4xl md:text-5xl font-black uppercase leading-none mb-6">Crónicas del Balón</h2>
                  <p className="text-f1-muted text-lg mb-8 max-w-lg leading-relaxed">
                    Relatos de leyenda y los genios que forjaron la historia del fútbol. Una columna exclusiva de Sergio López.
                  </p>
                  <div>
                    <a href="cronicas-del-balon.html" className="inline-block bg-f1-special text-black font-header font-black px-8 py-3 rounded uppercase tracking-wider hover:scale-105 transition-transform">
                      Explorar Historias
                    </a>
                  </div>
                </div>
                <div className="flex-1 min-h-[300px] relative">
                  <img 
                    src="Robert Prosinečki.jpg" 
                    className="absolute inset-0 w-full h-full object-cover opacity-60 grayscale hover:grayscale-0 transition-all duration-700" 
                    alt="Cronicas" 
                  />
                </div>
              </section>

              {/* POSICIONES */}
              <div className="mb-8 flex items-center gap-4">
                <div className="w-1.5 h-10 bg-f1-accent"></div>
                <h2 className="font-header text-3xl font-bold uppercase tracking-tight">Posiciones</h2>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-16">
                {STANDINGS.map((league) => (
                  <div key={league.name} className="bg-f1-card border border-white/10 rounded-xl overflow-hidden flex flex-col">
                    <a href={league.link} className="bg-white/5 p-4 border-b-2 border-f1-primary flex justify-between items-center hover:bg-white/10 transition-colors">
                      <span className="font-header font-bold text-sm uppercase tracking-widest">{league.name}</span>
                      <i className={`fa-solid ${league.icon} text-f1-accent`}></i>
                    </a>
                    <div className="p-2 flex-grow">
                      <table className="w-full text-xs text-left">
                        <tbody>
                          {league.rows.map((row, idx) => (
                            <tr key={idx} className="border-b border-white/5 hover:bg-white/5 transition-colors">
                              <td className="py-3 px-3 flex items-center"><span className="w-5 font-black text-f1-accent">{idx + 1}</span>{row.name}</td>
                              <td className="py-3 px-3 text-right font-header font-bold text-f1-accent">{row.val}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    <a href={league.link} className="bg-black/40 text-center py-3 text-[0.65rem] font-bold uppercase tracking-widest text-white/60 hover:text-white transition-all">Ver Tabla Completa</a>
                  </div>
                ))}
              </div>

              {/* --- GRID DE CATEGORÍAS --- */}
              <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-4 mb-20">
                {CATEGORY_CARDS.map((card) => (
                  <a 
                    key={card.name} 
                    href={card.link} 
                    className="group bg-white/5 p-6 rounded-xl border border-transparent hover:border-f1-accent hover:bg-f1-card transition-all flex flex-col items-center text-center"
                  >
                    <i className={`fa-solid ${card.icon} text-3xl mb-4 group-hover:scale-110 transition-transform ${card.special ? 'text-f1-special' : 'text-f1-accent'}`}></i>
                    <span className="font-header font-bold text-[0.7rem] uppercase tracking-widest text-f1-muted group-hover:text-white transition-colors">
                      {card.name}
                    </span>
                  </a>
                ))}
              </div>
            </main>

            {/* FOOTER */}
            <footer className="bg-black py-20 px-5 text-center mt-auto">
              <div className="mb-6">
                <span className="font-header font-black italic text-5xl tracking-tighter uppercase">F1RST<span className="text-f1-accent">SPORTS</span></span>
              </div>
              <div className="max-w-4xl mx-auto mb-12">
                <p className="text-white text-[0.8rem] md:text-[0.95rem] font-bold uppercase tracking-widest leading-relaxed">
                  SIEMPRE PR1MERO EN LA INFORMACIÓN DEPORTIVA. ANÁLISIS, OPINIÓN Y LA <br className="hidden md:block" /> COBERTURA MÁS COMPLETA DE TUS DEPORTES FAVORITOS.
                </p>
              </div>
              <div className="flex justify-center gap-10 mb-16 text-3xl text-white">
                <i className="fa-brands fa-facebook hover:text-f1-accent cursor-pointer"></i>
                <i className="fa-brands fa-x-twitter hover:text-f1-accent cursor-pointer"></i>
                <i className="fa-brands fa-instagram hover:text-f1-accent cursor-pointer"></i>
                <i className="fa-solid fa-envelope hover:text-f1-accent cursor-pointer"></i>
              </div>
              <div className="text-[0.65rem] text-white/30 font-black uppercase tracking-[0.3em]">&copy; 2026 F1RSTSPORTS MEDIA. TODOS LOS DERECHOS RESERVADOS.</div>
            </footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
