    <style>
        /* --- VARIABLES --- */
        :root {
            --bg-body: #050505;
            --bg-card: #0a0a0a;
            --glass: rgba(20, 20, 20, 0.95);
            --accent: #ccff00;
            --primary: #2563eb;

            --text-muted: #a1a1aa;
            --border: 1px solid rgba(255, 255, 255, 0.1);
            --font-head: 'Chakra Petch', sans-serif;
            --font-body: 'Inter', sans-serif;

        body { margin: 0; padding: 0; background-color: var(--bg-body); color: var(--text-main); font-family: var(--font-body); overflow-x: hidden; }
        a { text-decoration: none; color: white; transition: all 0.3s ease; }

        /* --- TOP BAR & SOCIAL ICONS --- */
        .top-bar { background: #000; padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .social-icons { display: flex; gap: 15px; }
        .social-icons a { color: var(--text-muted); font-size: 1rem; transition: 0.3s; }
        .social-icons a:hover { color: var(--accent); transform: scale(1.1); }
        
        header { 
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 15px 5%; display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .brand-link { display: flex; align-items: center; gap: 10px; }
        .logo-img img { height: 45px; width: auto; }
        .brand-text { font-family: var(--font-head); font-weight: 700; font-style: italic; font-size: 1.6rem; color: white; letter-spacing: -1px; }

        nav { display: flex; gap: 20px; }
        nav a { font-family: var(--font-head); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); }
        nav a:hover, nav a.active { color: var(--accent); }
        .btn-qs { border: 1px solid var(--accent); color: var(--accent) !important; padding: 5px 12px; border-radius: 50px; }
        .btn-qs:hover { background: var(--accent); color: black !important; }

        /* --- SCORE TICKER (AJUSTADO) --- */
        .score-ticker-container { background: #080808; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; height: 75px; overflow: hidden; position: relative; z-index: 100; }
        .ticker-label { background: var(--primary); color: white; font-family: var(--font-head); font-weight: 800; display: flex; align-items: center; padding: 0 20px; font-size: 0.85rem; z-index: 10; text-transform: uppercase; box-shadow: 10px 0 20px rgba(0,0,0,0.5); }
        
        .score-track { display: flex; align-items: center; white-space: nowrap; will-change: transform; animation: scroll-left 40s linear infinite; } 
        .score-ticker-container:hover .score-track { animation-play-state: paused; }
        
        .score-card { background: transparent; border-right: 1px solid rgba(255,255,255,0.1); min-width: 220px; padding: 10px 20px; display: flex; flex-direction: column; justify-content: center; }
        .score-league-row { display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: 700; color: #666; text-transform: uppercase; margin-bottom: 4px; }
        .score-teams { display: flex; justify-content: space-between; font-weight: 600; color: white; font-size: 0.85rem; }
        .score-val { color: var(--accent); font-family: 'Chakra Petch'; }
        
        .status-live { color: #ff4444; animation: blink 1.5s infinite; }
        .status-future { color: var(--accent); }

        /* --- RESTO DE ESTILOS (IGUALES A TU BASE) --- */
        .ticker-wrap { background: var(--bg-card); overflow: hidden; white-space: nowrap; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .ticker { display: inline-block; animation: scroll 60s linear infinite; }
        .ticker-item { margin-right: 50px; font-family: var(--font-head); font-size: 0.9rem; font-weight: 700; text-transform: uppercase; color: #ddd; }

        .container { max-width: 1400px; margin: 40px auto; padding: 0 20px; }
        .carousel-container { position: relative; width: 100%; height: 65vh; min-height: 500px; overflow: hidden; border-bottom: 4px solid var(--accent); background: black; border-radius: 12px; }
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; opacity: 0; transition: opacity 0.5s ease-in-out; }
        .slide.active { display: flex; opacity: 1; z-index: 5; }
        .slide img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.6); }
        .slide-content { position: absolute; bottom: 0; left: 0; width: 100%; padding: 60px; background: linear-gradient(0deg, rgba(0,0,0,1) 0%, rgba(0,0,0,0) 100%); z-index: 10; }
        .slide-title { font-family: var(--font-head); font-size: 3.5rem; margin: 0 0 20px; color: white; text-transform: uppercase; }
        
        .latest-news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .news-card { background: var(--bg-card); border: var(--border); border-radius: 12px; overflow: hidden; transition: 0.4s; }
        .news-card:hover { transform: translateY(-10px); border-color: var(--accent); }
        .card-img { width: 100%; height: 220px; object-fit: cover; }
        .card-body { padding: 25px; }

        .standings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .standing-card { background: #111; border: 1px solid #333; border-radius: 12px; overflow: hidden; }
        .mini-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .mini-table td { padding: 12px 15px; border-bottom: 1px solid #222; }

        .league-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin-top: 60px; padding: 0; list-style: none; }
        .league-item { background: rgba(255,255,255,0.05); padding: 30px 10px; text-align: center; border-radius: 8px; }

        footer { background: #000; border-top: 1px solid #222; padding: 60px 5%; margin-top: 80px; text-align: center; }
        .footer-socials { margin: 20px 0; display: flex; justify-content: center; gap: 25px; }
        .footer-socials a { font-size: 1.5rem; color: #fff; transition: 0.3s; }
        .footer-socials a:hover { color: var(--accent); }

        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes blink { 50% { opacity: 0.5; } }

        @media (max-width: 900px) {
            .slide-title { font-size: 2rem; }
            nav { display: none; }
        }
    </style>

    <script>
        // 1. MARCADORES ACTUALIZADOS Y MEJORADOS
        const marcadoresContainer = document.getElementById("marcadores");
        
        const liveScores = [
            { liga: "NFL WC", local: "Steelers", vis: "Texans", s1: "7", s2: "3", st: "EN VIVO", fecha: "HOY", hora: "Q1 08:30" },
            { liga: "NFL WC", local: "Patriots", vis: "Chargers", s1: "16", s2: "3", st: "FINAL", fecha: "11 ENE", hora: "Fin" },
            { liga: "LIGA MX", local: "Puebla", vis: "Mazatlán", s1: "-", s2: "-", st: "PRÓX", fecha: "13 ENE", hora: "17:00" },
            { liga: "LIGA MX", local: "Necaxa", vis: "Monterrey", s1: "-", s2: "-", st: "PRÓX", fecha: "13 ENE", hora: "19:00" },
            { liga: "LIGA MX", local: "Juárez", vis: "Chivas", s1: "-", s2: "-", st: "PRÓX", fecha: "13 ENE", hora: "21:10" },
            { liga: "LIGA MX", local: "América", vis: "San Luis", s1: "-", s2: "-", st: "PRÓX", fecha: "14 ENE", hora: "19:05" },
            { liga: "NFL DIV", local: "Broncos", vis: "Bills", s1: "-", s2: "-", st: "SÁBADO", fecha: "17 ENE", hora: "15:30" }
        ];

        function renderScores() {
            let html = "";
            // Duplicamos el array para el efecto de scroll infinito
            const doubleScores = [...liveScores, ...liveScores];
            
            doubleScores.forEach(game => {
                let statusClass = "";
                let statusIcon = "";
                
                if(game.st === "EN VIVO") {
                    statusClass = "status-live";
                    statusIcon = "● ";
                } else if(game.st === "PRÓX" || game.st === "SÁBADO") {
                    statusClass = "status-future";
                }

                html += `
                    <div class="score-card">
                        <div class="score-league-row">
                            <span>${game.liga}</span>
                            <span class="${statusClass}">${statusIcon}${game.fecha} | ${game.hora}</span>
                        </div>
                        <div class="score-teams">
                            <div style="display:flex; flex-direction:column;">
                                <span>${game.local}</span>
                                <span>${game.vis}</span>
                            </div>
                            <div style="display:flex; flex-direction:column; text-align:right;">
                                <span class="score-val">${game.s1}</span>
                                <span class="score-val">${game.s2}</span>
                            </div>
                        </div>
                    </div>`;
            });
            marcadoresContainer.innerHTML = html;
        }

        // Ejecutar funciones
        renderScores();

        // 2. LÓGICA DEL CARRUSEL (Mantenida)
        let slideIndex = 1;
        function showSlides(n) {
            let slides = document.getElementsByClassName("slide");
            if (n > slides.length) slideIndex = 1;
            if (n < 1) slideIndex = slides.length;
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";
                slides[i].classList.remove("active");
            }
            slides[slideIndex-1].style.display = "flex";
            setTimeout(() => slides[slideIndex-1].classList.add("active"), 10);
        }
        function plusSlides(n) { showSlides(slideIndex += n); }
        setInterval(() => plusSlides(1), 5000);
        showSlides(slideIndex);
    </script>
