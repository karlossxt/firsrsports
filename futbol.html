<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fútbol | F1rstSports - Cobertura Global</title>
    <link rel="icon" type="image/png" href="logof1.png">

    <!-- Fuentes y Estilos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- VARIABLES Y BASES --- */
        :root {
            --bg-body: #050505;
            --bg-card: #0a0a0a;
            --glass: rgba(20, 20, 20, 0.95);
            --accent: #ccff00;
            --primary: #2563eb;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border: 1px solid rgba(255, 255, 255, 0.1);
            --font-head: 'Chakra Petch', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        body { margin: 0; padding: 0; background-color: var(--bg-body); color: var(--text-main); font-family: var(--font-body); overflow-x: hidden; }
        a { text-decoration: none; color: white; transition: 0.3s; }

        /* --- HEADER --- */
        .top-bar { background: #000; padding: 8px 5%; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .social-icons { display: flex; gap: 15px; }
        .social-icons a { color: var(--text-muted); transition: 0.3s; }
        .social-icons a:hover { color: var(--accent); }

        header { 
            background: var(--glass); backdrop-filter: blur(10px);
            padding: 15px 5%; display: flex; align-items: center; justify-content: space-between; 
            position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .brand-text { font-family: var(--font-head); font-weight: 700; font-style: italic; font-size: 1.6rem; letter-spacing: -1px; }

        nav { display: flex; gap: 20px; }
        nav a { font-family: var(--font-head); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); }
        nav a:hover, nav a.active { color: var(--accent); }

        /* --- NAVEGACIÓN DE LIGAS --- */
        .leagues-nav { background: #080808; padding: 30px 0; border-bottom: 1px solid #111; }
        .leagues-wrapper { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; gap: 30px; overflow-x: auto; padding: 0 20px; }
        .leagues-wrapper::-webkit-scrollbar { display: none; }

        .league-item { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 90px; text-align: center; }
        .logo-circle { 
            width: 70px; height: 70px; background: #111; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            border: 2px solid #222; transition: 0.4s; 
        }
        .logo-circle img { width: 45px; height: 45px; object-fit: contain; filter: grayscale(1); transition: 0.4s; }
        .league-name { font-family: var(--font-head); font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

        .league-item:hover .logo-circle { border-color: var(--accent); transform: translateY(-5px); box-shadow: 0 0 20px rgba(204, 255, 0, 0.2); }
        .league-item:hover .logo-circle img { filter: grayscale(0); }
        .league-item:hover .league-name { color: var(--accent); }

        /* --- HERO FÚTBOL --- */
        .football-hero { 
            height: 400px; background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80&w=1400');
            background-size: cover; background-position: center; display: flex; align-items: center; padding: 0 10%; margin-bottom: 40px;
